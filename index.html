<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSIDE 통합 포털</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* 원본 페이지와 동일한 색상 및 폰트 변수 설정 */
:root {
  --bg:#f5f5f5; --bg2:#ffffff; --bg3:#ebebeb;
  --border:#d5d5d5; --border2:#cccccc; --border3:#e0e0e0;
  --text:#333333; --text2:#555555; --text3:#666666; --text4:#999999;
  --accent:#3b4890; --accent-bg:rgba(59,72,144,0.08);
  
  --sf:var(--bg2); --sf2:var(--bg3); --bd:var(--border);
  --gold:var(--accent); --gold2:#4a5a9f;
  --dim:var(--text3);
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nanum Gothic',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* 상단 헤더 UI */
.hd{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--sf);border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:100}
.hd-icon{font-size:26px}.hd-t{font-size:15px;font-weight:800;color:var(--gold)}.hd-s{font-size:11px;color:var(--dim);margin-top:2px}

/* 메인 컨테이너 */
.container { max-width: 820px; margin: 40px auto; padding: 0 20px; }

/* 안내 배너 UI */
.notice-sec {
    background: var(--sf2);
    border: 1px solid var(--bd);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 24px;
    text-align: center;
    font-size: 14px;
    color: var(--text);
    font-weight: 700;
}
.notice-sec strong { color: var(--gold); font-weight: 800; }

/* 디시인사이드 스타일 리스트 UI */
.board-list {
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--border2);
    background: var(--sf);
    border-radius: 4px;
    overflow: hidden;
}

.board-item {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border3);
    text-decoration: none;
    transition: background-color 0.15s ease;
}

.board-item:hover {
    background-color: var(--accent-bg);
}

.item-thumb {
    width: 90px;
    height: 60px;
    flex-shrink: 0;
    margin-right: 14px;
    background-color: var(--border3);
    border-radius: 2px;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

.item-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.item-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    flex: 1;
    min-width: 0; /* 말줄임표(ellipsis) 작동을 위해 필수 */
}

.item-title-wrap {
    display: flex;
    align-items: center;
    font-size: 17px;
    color: var(--text);
}

.item-title {
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.5px;
}

.item-meta {
    font-size: 13px;
    color: var(--text4);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
</style>
</head>
<body>

<!-- 상단 헤더 바 -->
<div class="hd">
  <div class="hd-icon">🐉</div>
  <div>
    <div class="hd-t">INSIDE 포털</div>
    <div class="hd-s">통합 메인 홈페이지</div>
  </div>
</div>

<div class="container">
  
  <!-- 안내 배너 -->
  <div class="notice-sec">
     원하시는 메뉴를 선택해주세요.<br>
     클릭 시 <strong>해당 페이지</strong>로 즉시 이동합니다.
  </div>
  
  <!-- 게시판 형태 메뉴 리스트 -->
  <div class="board-list">
    <!-- 첫 번째 항목: cal.html 링크 -->
    <a href="cal.html" class="board-item">
      <!-- 썸네일 이미지 (아래 src에 원하는 이미지 경로를 넣으세요) -->
      <div class="item-thumb">
        <img src="https://via.placeholder.com/150x100/cccccc/999999?text=IMG" alt="썸네일">
      </div>
      
      <!-- 제목 및 텍스트 정보 -->
      <div class="item-content">
        <div class="item-title-wrap">
          <span class="item-title">INSIDE 계산기 - 정령 티어 분석 및 세팅 확인</span>
        </div>
        <!-- 하단 텍스트 입력 부분 -->
        <div class="item-meta">
          호날두 | 15:00
        </div>
      </div>
    </a>
    
    <!-- 두 번째 항목: great.html 링크 -->
    <a href="great.html" class="board-item">
      <!-- 썸네일 이미지 (아래 src에 원하는 이미지 경로를 넣으세요) -->
      <div class="item-thumb">
        <img src="https://via.placeholder.com/150x100/cccccc/999999?text=IMG" alt="썸네일">
      </div>
      
      <!-- 제목 및 텍스트 정보 -->
      <div class="item-content">
        <div class="item-title-wrap">
          <span class="item-title">[공지] Great 페이지 부가 기능으로 이동합니다</span>
        </div>
        <!-- 하단 텍스트 입력 부분 -->
        <div class="item-meta">
          챗지피티(ChatGPT) | 15:00
        </div>
      </div>
    </a>
  </div>

</div>

</body>
</html>
