<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSIDE 통합 포털</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* 원본 페이지와 동일한 색상 및 폰트 변수 설정 */
:root {
  --bg:#f5f5f5; --bg2:#ffffff; --bg3:#ebebeb;
  --border:#d5d5d5; --border2:#cccccc; --border3:#e0e0e0;
  --text:#333333; --text2:#555555; --text3:#666666; --text4:#999999;
  --accent:#3b4890; --accent-bg:rgba(59,72,144,0.08);
  
  --sf:var(--bg2); --sf2:var(--bg3); --bd:var(--border);
  --gold:var(--accent); --gold2:#4a5a9f;
  --dim:var(--text3);
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nanum Gothic',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* 상단 헤더 UI */
.hd{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--sf);border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:100}
/* 헤더 정사각형 아이콘 셋팅 */
.hd-icon {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: 4px;
    background-color: var(--border3);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}
.hd-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* 메인 컨테이너 */
.container { max-width: 820px; margin: 40px auto; padding: 0 20px; }

/* 안내 배너 UI */
.notice-sec {
    background: var(--sf2);
    border: 1px solid var(--bd);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 24px;
    text-align: center;
    font-size: 14px;
    color: var(--text);
    font-weight: 700;
}
.notice-sec strong { color: var(--gold); font-weight: 800; }

/* 디시인사이드 스타일 리스트 UI */
.board-list {
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--border2);
    background: var(--sf);
    border-radius: 4px;
    overflow: hidden;
}

.board-item {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border3);
    text-decoration: none;
    transition: background-color 0.15s ease;
}

.board-item:hover {
    background-color: var(--accent-bg);
}

.item-thumb {
    /* 기존 90px x 60px에서 비율을 유지하며 크기 축소 */
    width: 72px;
    height: 48px;
    flex-shrink: 0;
    margin-right: 12px;
    background-color: var(--border3);
    border-radius: 2px;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

.item-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.item-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    flex: 1;
    min-width: 0; /* 말줄임표(ellipsis) 작동을 위해 필수 */
}

.item-title-wrap {
    display: flex;
    align-items: center;
    /* 글자 크기 축소 (기존 17px -> 15px) */
    font-size: 15px;
    color: var(--text);
}

.item-title {
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.5px;
}

.item-meta {
    /* 하단 정보 글자 크기 축소 (기존 13px -> 12px) */
    font-size: 12px;
    color: var(--text4);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
</style>
</head>
<body>

<!-- 상단 헤더 바 -->
<div class="hd">
  <!-- 헤더 로고 이미지 부분 -->
  <div class="hd-icon">
    <img src="images/logo.jpg" alt="로고">
  </div>
  <div>
    <div class="hd-t">INSIDE (4갤길)</div>
    <div class="hd-s">Myosotis, 그라타타, LapisLazuli</div>
  </div>
</div>

<div class="container">
  
  <!-- 안내 배너 -->
  <div class="notice-sec">
     클릭 시 <strong>해당 페이지</strong>로 즉시 이동합니다.
  </div>
  
  <!-- 게시판 형태 메뉴 리스트 -->
  <div class="board-list">
    <!-- 첫 번째 항목: cal.html 링크 -->
    <a href="cal.html" class="board-item">
      <!-- 썸네일 이미지 -->
      <div class="item-thumb">
        <img src="images/thumb1.jpg" alt="썸네일">
      </div>
      
      <!-- 제목 및 텍스트 정보 -->
      <div class="item-content">
        <div class="item-title-wrap">
          <span class="item-title">길전세팅 전투력측정기</span>
        </div>
        <!-- 하단 텍스트 입력 부분 -->
        <div class="item-meta">
          버프좀봐라 | 05:23
        </div>
      </div>
    </a>
    
    <!-- 두 번째 항목: great.html 링크 -->
    <a href="great.html" class="board-item">
      <!-- 썸네일 이미지 -->
      <div class="item-thumb">
        <img src="images/thumb2.jpg" alt="썸네일">
      </div>
      
      <!-- 제목 및 텍스트 정보 -->
      <div class="item-content">
        <div class="item-title-wrap">
          <span class="item-title">INSIDE 계산기_2.0v</span>
        </div>
        <!-- 하단 텍스트 입력 부분 -->
        <div class="item-meta">
          정령분석표 | 15:57
        </div>
      </div>
    </a>
  </div>

</div>

</body>
</html>
