<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 브라우저에게 이 페이지는 라이트 모드로만 렌더링할 것을 강력히 권고 -->
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
  
<title>드래곤빌리지1 비밸 시뮬레이터</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nanum Gothic',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.hd{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--sf);border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:100}
.hd-icon{font-size:26px}.hd-t{font-size:15px;font-weight:800;color:var(--gold)}.hd-s{font-size:11px;color:var(--dim);margin-top:2px}
.tabs{display:flex;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:50px;z-index:99}
.tab-btn{flex:1;padding:12px 20px;background:none;border:none;border-bottom:3px solid transparent;color:var(--dim);font-family:'Nanum Gothic',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.tc{display:none}.tc.active{display:block}
.ti{max-width:100%;padding:14px 24px}.ti-sim{max-width:1200px;margin:0 auto;padding:14px 24px}
.sec{background:var(--sf);border:1px solid var(--bd);border-radius:8px;margin-bottom:14px;overflow:hidden}
.sec-hd{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;background:var(--sf2);border-bottom:1px solid var(--bd);font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.5px}
.sec-bd{padding:14px 16px}
select,input[type=number],input[type=text]{background:var(--sf2);border:1px solid var(--bd);color:var(--text);padding:5px 9px;border-radius:5px;font-family:'Nanum Gothic',sans-serif;font-size:13px}
select:focus,input:focus{outline:none;border-color:var(--gold)}

/* 라디오 버튼 UI 커스텀 */
.radio-opts{display:grid;grid-template-columns:repeat(2, 1fr);gap:10px;}
@media(max-width:600px){ .radio-opts{grid-template-columns:1fr;} }
.radio-opts label{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;padding:10px 14px;background:var(--sf2);border:1px solid var(--bd);border-radius:6px;transition:all .15s;font-weight:700}
.radio-opts label:hover{background:rgba(232,184,75,.08);border-color:var(--gold)}
.radio-opts input[type=radio]{accent-color:var(--gold);width:16px;height:16px}

.sp-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sp-ocard{display:flex;align-items:center;gap:7px;padding:8px 10px;background:var(--sf);border:1px solid var(--bd);border-radius:5px}
.sp-onum{color:var(--gold);font-size:11px;font-weight:800;min-width:18px}
.sp-ocard select{flex:1;font-size:12px}
.sp-oval{color:var(--green);font-size:11px;min-width:46px;text-align:right}
.sp-preset-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:10px}
.sp-preset-btn{background:var(--sf2);border:1px solid var(--bd);border-radius:5px;padding:6px 8px;color:var(--text);cursor:pointer;font-family:'Nanum Gothic',sans-serif;text-align:center;transition:all .15s;min-height:34px;white-space:nowrap}
.sp-preset-btn:hover{border-color:var(--gold);background:rgba(232,184,75,.08)}
.sp-preset-btn.active{border-color:var(--gold);background:rgba(232,184,75,.14)}
.sp-preset-name{display:inline;font-size:12px;font-weight:800;color:var(--gold)}
.sp-preset-desc{display:inline;font-size:11px;color:var(--text);margin-left:5px}
.fg label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.fg select{width:100%}

.btn-reset{background:none;border:1px solid var(--red);color:var(--red);padding:6px 13px;border-radius:5px;cursor:pointer;font-family:'Nanum Gothic',sans-serif;font-size:13px;font-weight:700}
.btn-reset:hover{background:rgba(248,113,113,.1)}
.btn-sim{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold2),var(--gold));border:none;border-radius:8px;color:#0a0c18;font-family:'Nanum Gothic',sans-serif;font-size:16px;font-weight:800;cursor:pointer;margin:12px 0;letter-spacing:-.5px;transition:opacity .15s,transform .1s}
.btn-sim:hover{opacity:.92}.btn-sim:active{transform:scale(.99)}.btn-sim:disabled{opacity:.5;cursor:not-allowed}

.sim-cfg{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:10px}
.cfg-lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:7px}
.btn-grp{display:flex;gap:4px}
.btn-grp button{flex:1;padding:8px 4px;background:var(--sf2);border:1px solid var(--bd);border-radius:4px;color:var(--dim);cursor:pointer;font-family:'Nanum Gothic',sans-serif;font-size:13px;font-weight:700;transition:all .15s}
.btn-grp button.active{background:rgba(232,184,75,.12);border-color:var(--gold);color:var(--gold)}

.res-wrap{overflow-x:hidden}
.medal{font-size:20px}.rank-n{font-weight:800;color:var(--dim)}
.dtype-b{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:800;border:1px solid}
.bv-cell{font-family:'Courier New',monospace;font-size:14px;font-weight:800;color:var(--gold);white-space:nowrap}
.st-cell{font-family:'Courier New',monospace;font-size:12px;white-space:nowrap}
.gem-tags{display:flex;flex-wrap:wrap;gap:3px}
.gem-tag{padding:2px 6px;border-radius:3px;font-size:11px;font-weight:700;background:rgba(255,255,255,.07)}
.enc-b{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;font-weight:700;border:1px solid var(--green);color:var(--green);background:rgba(74,222,128,.1)}
.enc-none{border-color:var(--dimmer);color:var(--dimmer);background:none}

.res-tab-btn{padding:9px 18px;background:none;border:none;border-bottom:3px solid transparent;color:var(--dim);font-family:'Nanum Gothic',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.res-tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}

/* 다크모드 여부와 상관없이 항상 라이트 테마(디시인사이드 스타일) 색상 강제 고정 */
:root, [data-theme="dark"], [data-theme="light"] {
  --bg:#f5f5f5; --bg2:#ffffff; --bg3:#ebebeb;
  --border:#d5d5d5; --border2:#cccccc; --border3:#e0e0e0;
  --text:#333333; --text2:#555555; --text3:#666666; --text4:#999999;
  --accent:#3b4890; --accent-bg:rgba(59,72,144,0.12); --accent-border:rgba(59,72,144,0.30);
  
  --sf:var(--bg2); --sf2:var(--bg3); --bd:var(--border);
  --gold:var(--accent); --gold2:var(--accent);
  --dim:var(--text3); --dimmer:var(--text4);
  --red:#f87171; --green:#4ade80; --blue:#60a5fa;
  --hpc:#fbbf24; --atc:#f87171; --dfc:#60a5fa;
  
  /* 브라우저 기본 스크롤바 및 UI를 강제로 라이트 모드로 고정 */
  color-scheme: light !important; 
}
</style>
</head>
<body>

<div class="hd">
  <div class="hd-icon">🐉</div>
  <div><div class="hd-t">비밸 시뮬레이터 (간편 입력)</div><div class="hd-s">선택한 수치의 모든 조합을 자동 계산합니다</div></div>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tab-btn-spec" onclick="switchTab('spec')">스펙 간편 설정</button>
  <button class="tab-btn" id="tab-btn-sim" onclick="switchTab('sim')">시뮬레이터 (결과)</button>
</div>

<!-- ■ 내 스펙 간편 설정 탭 -->
<div id="tab-spec" class="tc active"><div class="ti">
  <!-- CSS 변수를 인라인으로 덮어씌워 스펙 설정 탭에만 dcinside 테마(딥블루 포인트, 톤 다운된 라이트모드)를 적용합니다 -->
  <div style="max-width: 820px; margin: 0 auto; background: #f5f5f5; padding: 14px; border-radius: 8px; border: 1px solid #d5d5d5; --ufont: clamp(11px, 2.6vw, 14px); --sf: #f5f5f5; --sf2: #ebebeb; --bd: #d5d5d5; --text: #333333; --dim: #666666; --gold: #3b4890; --gold2: #4a5a9f; color: var(--text);">
    
   <!-- 상단 1: 타입 / 버프 / 너프 (정령 박스 UI 적용) -->
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px;">
      <!-- 드래곤 타입 -->
      <div style="background: var(--sf2); border: 1px solid var(--bd); border-radius: 6px; padding: 8px 4px; display: flex; flex-direction: column; gap: 6px; justify-content: center;">
        <div style="text-align: center; font-weight: 800; color: var(--dim); font-size: var(--ufont); white-space: nowrap;">드래곤 타입</div>
        <select onchange="setType(this.value)" id="sel-type" style="width: 100%; min-width: 0; background: var(--sf); border: 1px solid var(--bd); color: var(--text); padding: 4px 2px; border-radius: 4px; font-weight: 800; outline: none; cursor: pointer; font-size: var(--ufont); text-align: center; text-align-last: center;">
          <option value="체력형" selected>체력형</option>
          <option value="공격형">공격형</option>
          <option value="방어형">방어형</option>
          <option value="체공형">체공형</option>
          <option value="체방형">체방형</option>
          <option value="공방형">공방형</option>
        </select>
      </div>

      <!-- 적용 버프 -->
      <div style="background: var(--sf2); border: 1px solid var(--bd); border-radius: 6px; padding: 8px 4px; display: flex; flex-direction: column; gap: 6px; justify-content: center;">
        <div style="text-align: center; font-weight: 800; color: var(--dim); font-size: var(--ufont); white-space: nowrap;">적용 버프</div>
        <select onchange="setExactBuf(this.value)" id="sel-buf" style="width: 100%; min-width: 0; background: var(--sf); border: 1px solid var(--bd); color: var(--text); padding: 4px 2px; border-radius: 4px; font-weight: 800; outline: none; cursor: pointer; font-size: var(--ufont); text-align: center; text-align-last: center;">
          <option value="노버프" selected>노버프</option>
          <option value="체">체 1벞</option>
          <option value="공">공 1벞</option>
          <option value="방">방 1벞</option>
          <option value="체+체">체+체</option>
          <option value="공+공">공+공</option>
          <option value="방+방">방+방</option>
          <option value="체+공">체+공</option>
          <option value="체+방">체+방</option>
          <option value="공+방">공+방</option>
        </select>
      </div>

      <!-- 적용 너프 -->
      <div style="background: var(--sf2); border: 1px solid var(--bd); border-radius: 6px; padding: 8px 4px; display: flex; flex-direction: column; gap: 6px; justify-content: center;">
        <div style="text-align: center; font-weight: 800; color: var(--dim); font-size: var(--ufont); white-space: nowrap;">적용 너프</div>
        <select onchange="setExactNerf(this.value)" id="sel-nerf" style="width: 100%; min-width: 0; background: var(--sf); border: 1px solid var(--bd); color: var(--text); padding: 4px 2px; border-radius: 4px; font-weight: 800; outline: none; cursor: pointer; font-size: var(--ufont); text-align: center; text-align-last: center;">
          <option value="노너프" selected>노너프</option>
          <option value="체">체 1넢</option>
          <option value="공">공 1넢</option>
          <option value="방">방 1넢</option>
        </select>
      </div>
    </div>

    <!-- 상단 2: 등급 / 젬 / 장신구 / 펜던트 (정령 박스 UI 적용) -->
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px;">
      <!-- 드래곤 등급 -->
      <div style="background: var(--sf2); border: 1px solid var(--bd); border-radius: 6px; padding: 8px 4px; display: flex; flex-direction: column; gap: 6px; justify-content: center;">
        <div style="text-align: center; font-weight: 800; color: var(--dim); font-size: var(--ufont); white-space: nowrap;">드래곤 등급</div>
        <select onchange="setGrade(this.value)" id="sel-grade" style="width: 100%; min-width: 0; background: var(--sf); border: 1px solid var(--bd); color: var(--text); padding: 4px 2px; border-radius: 4px; font-weight: 800; outline: none; cursor: pointer; font-size: var(--ufont); text-align: center; text-align-last: center;">
          <option value="7.0">7.0</option>
          <option value="8.0">8.0</option>
          <option value="9.0" selected>9.0</option>
        </select>
      </div>

      <!-- 젬 수치 -->
      <div style="background: var(--sf2); border: 1px solid var(--bd); border-radius: 6px; padding: 8px 4px; display: flex; flex-direction: column; gap: 6px; justify-content: center;">
        <div style="text-align: center; font-weight: 800; color: var(--dim); font-size: var(--ufont); white-space: nowrap;">젬 수치</div>
        <select onchange="onGemLvl(parseInt(this.value))" id="sel-gem-lv" style="width: 100%; min-width: 0; background: var(--sf); border: 1px solid var(--bd); color: var(--text); padding: 4px 2px; border-radius: 4px; font-weight: 800; outline: none; cursor: pointer; font-size: var(--ufont); text-align: center; text-align-last: center;">
          <option value="38">38</option>
          <option value="40">40</option>
          <option value="42">42</option>
          <option value="44">44</option>
        </select>
      </div>

      <!-- 장신구 수치 -->
      <div style="background: var(--sf2); border: 1px solid var(--bd); border-radius: 6px; padding: 8px 4px; display: flex; flex-direction: column; gap: 6px; justify-content: center;">
        <div style="text-align: center; font-weight: 800; color: var(--dim); font-size: var(--ufont); white-space: nowrap;">장신구 수치</div>
        <select onchange="onAccLvl(parseInt(this.value))" id="sel-acc-lv" style="width: 100%; min-width: 0; background: var(--sf); border: 1px solid var(--bd); color: var(--text); padding: 4px 2px; border-radius: 4px; font-weight: 800; outline: none; cursor: pointer; font-size: var(--ufont); text-align: center; text-align-last: center;">
          <option value="17">17장</option>
          <option value="18">18장</option>
          <option value="19">19장</option>
          <option value="20">20장</option>
        </select>
      </div>

      <!-- 펜던트 -->
      <div style="background: var(--sf2); border: 1px solid var(--bd); border-radius: 6px; padding: 8px 4px; display: flex; flex-direction: column; gap: 6px; justify-content: center;">
        <div style="text-align: center; font-weight: 800; color: var(--dim); font-size: var(--ufont); white-space: nowrap;">펜던트</div>
        <select onchange="onPendType(this.value)" id="sel-pend-type" style="width: 100%; min-width: 0; background: var(--sf); border: 1px solid var(--bd); color: var(--text); padding: 4px 2px; border-radius: 4px; font-weight: 800; outline: none; cursor: pointer; font-size: var(--ufont); text-align: center; text-align-last: center;">
          <option value="달">달펜</option>
          <option value="태양">태펜</option>
        </select>
      </div>
    </div>
    <!-- 정령 옵션 테이블이 렌더링될 영역 -->
    <div id="sp-bd"></div>

    <!-- 안내 문구 -->
    <div style="font-size: var(--ufont); color:var(--dim); text-align:center; margin-bottom: 20px; margin-top: 14px; white-space: nowrap;">
      * 컬렉션은 <strong>체력 240, 공격 60, 방어 60</strong>으로 자동 적용됩니다.
    </div>

  <!-- 일괄 실행 버튼 -->
    <button class="btn-sim" id="btn-run-all" onclick="runAllSims()" style="margin-top:0; font-size: var(--ufont); padding: 12px; white-space: nowrap;">📊 일괄 시뮬레이션 연산 (분석표 + TOP 200)</button>
    
    <!-- 분석표 출력 영역 (복구됨!) -->
    <div id="table-res-wrap" style="margin-top: 14px; overflow-x: auto; display: none;"></div>
    
  </div>
</div></div>

<!-- ■ 시뮬레이터 탭 -->
<div id="tab-sim" class="tc"><div class="ti">
  <!-- 스펙 간편 설정 탭과 동일하게 dcinside 테마 CSS 변수를 인라인으로 적용합니다 -->
  <div style="max-width: 820px; margin: 0 auto; background: #f5f5f5; padding: 14px; border-radius: 8px; border: 1px solid #d5d5d5; --ufont: clamp(11px, 2.6vw, 14px); --sf: #f5f5f5; --sf2: #ebebeb; --bd: #d5d5d5; --text: #333333; --dim: #666666; --gold: #3b4890; --gold2: #4a5a9f; --bg: #ffffff; --border2: #e0e0e0; --border3: #cccccc; --accent: #3b4890; color: var(--text);">
    
    <!-- 🐉 적용된 정령 정보 표시 영역 (읽기 전용) -->
    <div id="sim-spirit-display" style="margin-bottom: 14px; display: none;"></div>

    <div class="sec" id="res-sec" style="display:none; margin-bottom: 0;">
      <div class="sec-hd">🏆 지정 조건 시뮬레이션 결과 — TOP 200</div>
      <div id="res-top"><div class="res-wrap"><div id="res-body-top"></div></div></div>
    </div>

  </div>
</div></div>

<script>
// ================================================================
// 게임 및 스펙 데이터 DB
// ================================================================
const TEM_BASE='https://raw.githubusercontent.com/yejoo0519/dogam/refs/heads/main/tem';
const ACC_IMG_MAP={
  '20':{'바뿔':13,'악보':20,'황보':21,'여보':22,'대뿔':1433,'물뿔':1435,'불뿔':1437},
  '19':{'악보':1273,'황보':1274,'여보':1275,'바뿔':1276,'대뿔':1306,'물뿔':1308,'불뿔':1310},
  '18':{'악보':1205,'황보':1206,'여보':1207,'바뿔':1202,'대뿔':1247,'물뿔':1249,'불뿔':1251},
  '17':{'악보':1102,'황보':1103,'여보':1104,'바뿔':1105,'대뿔':1130,'물뿔':1132,'불뿔':1134},
};
const accImg=(lv,name)=>{const n=ACC_IMG_MAP[String(lv)]?.[name];return n?`${TEM_BASE}/${n}.png`:'';}
const IMG_PEND={태양:`${TEM_BASE}/1337.png`,달:`${TEM_BASE}/1336.png`};

// 모든 장신구 데이터 (17~20단계)
const ACC_DB=[
 
  {n:'악보주 (체) 17',hp:0.17, atk:0, def:0, img:accImg(17,'악보')},{n:'황보주 (공) 17',hp:0, atk:0.17, def:0, img:accImg(17,'황보')},{n:'여보주 (방) 17',hp:0, atk:0, def:0.17, img:accImg(17,'여보')},
  {n:'물뿔 (체/공) 17',hp:0.11, atk:0.06, def:0, img:accImg(17,'물뿔')},{n:'물뿔 (체/방) 17',hp:0.11, atk:0, def:0.06, img:accImg(17,'물뿔')},{n:'불뿔 (공/체) 17',hp:0.06, atk:0.11, def:0, img:accImg(17,'불뿔')},

// 5슬롯 젬 배분 경우의 수 (중복조합) -> 21가지 고정
function genAllocs() {
  const res = [];
  for(let h=0; h<=5; h++) {
    for(let a=0; a<=5-h; a++) {
      let d = 5 - h - a;
      res.push([h, a, d]); // [hp개수, atk개수, def개수]
    }
  }
  return res;
}

   }
   return pends;
}

/* 스탯 산출 공식 (엑셀 원본 완벽 동기화) */
function calcStat(B, G, P, AP, SP, PP, SL, SB, C, BU) {
  // 1. INT((기본스탯+젬+물약)*(1+장신구+인첸트))
  const step1 = Math.floor((B + G + P) * (1 + AP));
  
  // 2. INT( step1*(1+정령퍼옵) + 정령플옵*(1+정령퍼옵) ) + 정령부가옵
  // 엑셀과 동일하게 두 값을 먼저 더한 후 Math.floor(INT) 처리
  const step2 = Math.floor(step1 * (1 + SP) + SL * (1 + SP)) + SB;
  
  // 3. INT( step2 * (1+펜던트) )
  const step3 = Math.floor(step2 * (1 + PP));
  
  // 4. 최종 합산: + INT(용스탯*버프) + 컬렉션
  return step3 + BU + C;
}

function procSpirit(){
  const sp=S.spirit;
  const plus={hp:0,atk:0,def:0},pct={hp:0,atk:0,def:0},bonus={hp:0,atk:0,def:0};
  for(let i=0;i<4;i++){
    const o=sp.opts[i];
    if(!o||!o.stat||!o.type)continue;
    if(o.type==='+')plus[o.stat]+=SP_PLUS[o.stat][i+1];
    else if(o.type==='%')pct[o.stat]+=SP_PCT[i+1];
  }
  if(sp.bonus&&SP_BONUS[sp.bonus])bonus[sp.bonus]=SP_BONUS[sp.bonus];
  return{plus,pct,bonus};
}

  ];
  return[
    {h:2,a:0,d:0,w:1/9,label:'체+체'},{h:1,a:1,d:0,w:2/9,label:'체+공'},{h:1,a:0,d:1,w:2/9,label:'체+방'},
    {h:0,a:2,d:0,w:1/9,label:'공+공'},{h:0,a:1,d:1,w:2/9,label:'공+방'},{h:0,a:0,d:2,w:1/9,label:'방+방'}
  ];
}

function calcPendPct(pend){
  let pH=0,pA=0,pD=0;
  if(pend){
    const mo=pend.type==='태양'?3:2;
    pend.options.slice(0,mo).forEach(o=>{
      const v=(o.val||0)/100;
      if(o.stat==='hp')pH+=v;else if(o.stat==='atk')pA+=v;else pD+=v;
    });
  }
  return{pH,pA,pD};
}

function runAllSims() {
  const btn = document.getElementById('btn-run-all');
  if (btn) {
    btn.disabled = true;
    btn.textContent = '⏳ 분석표 및 TOP 200 일괄 연산 중...';
  }

  // 시뮬레이터 탭에 정령 정보(읽기 전용) 렌더링
  renderSimSpiritDisplay();

  setTimeout(() => {
    try {
      // 1. 공통 환경 변수 가져오기
      S.gemLevel = parseInt(document.getElementById('sel-gem-lv').value);
      S.accLevel = parseInt(document.getElementById('sel-acc-lv').value);
      S.pendType = document.getElementById('sel-pend-type').value;

      const ownedAcc = ACC_DB.filter(a => getAccNum(a.n) === S.accLevel);
      const pends = getPends();
      const pool = buildPool();
      const allocs = genAllocs();
      const userSp = procSpirit();

      // ==========================================================
      // 2. 정령 버프효율 분석표 생성 로직
      // ==========================================================
      const buffsArr = [
        {h:0, a:0, d:0}, {h:1, a:0, d:0}, {h:0, a:1, d:0}, {h:0, a:0, d:1},
        {h:2, a:0, d:0}, {h:0, a:2, d:0}, {h:0, a:0, d:2},
        {h:1, a:1, d:0}, {h:1, a:0, d:1}, {h:0, a:1, d:1}
      ];

      const allSpirits = generateAllSpirits();
      const allRowBVs = [];
      const userRowBVs = [];

      DTYPES.forEach((dt) => {
        const bs = BASE[simGrade][dt];
        const bh = bs.hp, ba = bs.atk, bd = bs.def;

        const envs = [];
        ownedAcc.forEach(acc => {
          ['hp','atk','def'].forEach(enc => {
            const aH = acc.hp + (enc==='hp'?0.21:0);
            const aA = acc.atk + (enc==='atk'?0.21:0);
            const aD = acc.def + (enc==='def'?0.21:0);
            pends.forEach(pend => {
              const {pH, pA, pD} = calcPendPct(pend);
              allocs.forEach(alloc => {
                let gH=0, gA=0, gD=0;
                for(let i=0; i<alloc.length; i++){
                  gH += alloc[i]*pool[i].h; gA += alloc[i]*pool[i].a; gD += alloc[i]*pool[i].d;
                }
                envs.push({
                   baseH: Math.floor((bh + gH + 24)*(1 + aH)),
                   baseA: Math.floor((ba + gA +  6)*(1 + aA)),
                   baseD: Math.floor((bd + gD +  6)*(1 + aD)),
                   pH, pA, pD
                });
              });
            });
          });
        });

        const BU_H = buffsArr.map(b => Math.floor(bh * 0.2) * b.h + COLL.hp);
        const BU_A = buffsArr.map(b => Math.floor(ba * 0.2) * b.a + COLL.atk);
        const BU_D = buffsArr.map(b => Math.floor(bd * 0.2) * b.d + COLL.def);

        const evalSpirit = (sp) => {
           const sp_pH = 1 + sp.pct.hp, sp_pA = 1 + sp.pct.atk, sp_pD = 1 + sp.pct.def;
           const sp_plusH = sp.plus.hp * sp_pH, sp_plusA = sp.plus.atk * sp_pA, sp_plusD = sp.plus.def * sp_pD;
           const sp_bH = sp.bonus.hp, sp_bA = sp.bonus.atk, sp_bD = sp.bonus.def;

           const maxBVs = new Float64Array(10);
           for(let j=0; j<envs.length; j++) {
               const env = envs[j];
               const s3H = Math.floor( (Math.floor(env.baseH * sp_pH + sp_plusH) + sp_bH) * (1 + env.pH) );
               const s3A = Math.floor( (Math.floor(env.baseA * sp_pA + sp_plusA) + sp_bA) * (1 + env.pA) );
               const s3D = Math.floor( (Math.floor(env.baseD * sp_pD + sp_plusD) + sp_bD) * (1 + env.pD) );

               for(let k=0; k<10; k++) {
                   const bv = (s3H + BU_H[k]) * (s3A + BU_A[k]) * (s3D + BU_D[k]);
                   if(bv > maxBVs[k]) maxBVs[k] = bv;
               }
           }

           const rows = new Float64Array(14);
           rows[0] = maxBVs[0];
           rows[1] = maxBVs[1]; rows[2] = maxBVs[2]; rows[3] = maxBVs[3];
           rows[4] = (maxBVs[1] + maxBVs[2] + maxBVs[3]) / 3;
           rows[5] = maxBVs[4]; rows[6] = maxBVs[5]; rows[7] = maxBVs[6];
           rows[8] = maxBVs[7]; rows[9] = maxBVs[8]; rows[10] = maxBVs[9];

           const b2Arr = [maxBVs[4], maxBVs[5], maxBVs[6], maxBVs[7], maxBVs[8], maxBVs[9]];
           b2Arr.sort((a, b) => b - a);

           rows[11] = (b2Arr[0] + b2Arr[1] + b2Arr[2] + b2Arr[3] + b2Arr[4] + b2Arr[5]) / 6;
           rows[12] = (b2Arr[0] + b2Arr[1] + b2Arr[2]) / 3;
           rows[13] = (b2Arr[3] + b2Arr[4] + b2Arr[5]) / 3;

           return rows;
        };

        userRowBVs.push(evalSpirit(userSp));
        const dtAllRows = new Float64Array(3888 * 14);
        for(let i=0; i<3888; i++) {
           const rows = evalSpirit(allSpirits[i]);
           for(let r=0; r<14; r++) { dtAllRows[i*14 + r] = rows[r]; }
        }
        allRowBVs.push(dtAllRows);
      });

      window.tableSimData = { userRowBVs, allRowBVs, mode: window.tableSimData ? window.tableSimData.mode : 'bv' };
      renderAnalysisTable();

      // ==========================================================
      // 3. 단일 조건 TOP 200 계산 로직
      // ==========================================================
      const exactBufObj = parseExactBuf(simExactBuf);
      const exactNerfObj = parseExactNerf(simExactNerf);
      const top200 = doSimExact(ownedAcc, exactBufObj, exactNerfObj, pends, pool, allocs);
      renderResTop(top200);

      const rs = document.getElementById('res-sec');
      rs.style.display = '';

    } catch(e) {
      console.error(e);
      alert('오류: ' + e.message);
    }
    if (btn) {
      btn.disabled = false;
      btn.textContent = '📊 일괄 시뮬레이션 연산 (분석표 + TOP 200)';
    }
  }, 30);
}

// 3888가지 정령을 모두 생성하는 헬퍼 함수
function generateAllSpirits() {
  const res = [];
  const opts = [
    {s:'hp', t:'+'}, {s:'hp', t:'%'}, {s:'atk', t:'+'}, 
    {s:'atk', t:'%'}, {s:'def', t:'+'}, {s:'def', t:'%'}
  ];
  const bonuses = ['hp', 'atk', 'def'];
  
  for(let b of bonuses) {
    for(let o1 of opts) {
      for(let o2 of opts) {
        for(let o3 of opts) {
          for(let o4 of opts) {
             const plus = {hp:0, atk:0, def:0}, pct = {hp:0, atk:0, def:0}, bonus = {hp:0, atk:0, def:0};
             if(b === 'hp') bonus.hp = 40; if(b === 'atk') bonus.atk = 10; if(b === 'def') bonus.def = 10;

             const applyOpt = (o, level) => { if(o.t === '+') plus[o.s] += SP_PLUS[o.s][level]; else pct[o.s] += SP_PCT[level]; };
             applyOpt(o1, 1); applyOpt(o2, 2); applyOpt(o3, 3); applyOpt(o4, 4);
             res.push({plus, pct, bonus});
          }
        }
      }
    }
  }
  return res;
}

function fmtGem(alloc){
  if(!alloc||!alloc.length) return `<span style="color:var(--hpc); font-size:calc(100% + 3px);">0</span> <span style="color:var(--dim); font-size:calc(100% + 3px);">/</span> <span style="color:var(--atc); font-size:calc(100% + 3px);">0</span> <span style="color:var(--dim); font-size:calc(100% + 3px);">/</span> <span style="color:var(--dfc); font-size:calc(100% + 3px);">0</span>`;
  let h=0, a=0, d=0;
  alloc.forEach(({k,g})=>{
    if(g.s==='hp') h+=k;
    else if(g.s==='atk') a+=k;
    else if(g.s==='def') d+=k;
  });
  return `<span style="color:var(--hpc); font-size:calc(100% + 3px);">${h}</span> <span style="color:var(--dim); font-size:calc(100% + 3px);">/</span> <span style="color:var(--atc); font-size:calc(100% + 3px);">${a}</span> <span style="color:var(--dim); font-size:calc(100% + 3px);">/</span> <span style="color:var(--dfc); font-size:calc(100% + 3px);">${d}</span>`;
}

function fmtPendMob(pend){
  if(!pend)return'<span style="color:var(--dimmer);font-size:inherit;">없음</span>';

  const opts=pend.options.slice(0,mo).filter(o=>o&&o.stat).map(o=>{

function runAllSims() {
  const btn = document.getElementById('btn-run-all');
  if (btn) {
    btn.disabled = true;
    btn.textContent = '⏳ 분석표 및 TOP 200 일괄 연산 중...';
  }

  // 시뮬레이터 탭에 정령 정보 및 하이라이트 UI 렌더링
  renderSimSpiritDisplay();

  setTimeout(() => {
    try {
      S.gemLevel = parseInt(document.getElementById('sel-gem-lv').value);
      S.accLevel = parseInt(document.getElementById('sel-acc-lv').value);
      S.pendType = document.getElementById('sel-pend-type').value;

      const ownedAcc = ACC_DB.filter(a => getAccNum(a.n) === S.accLevel);
      const pends = getPends();
      const pool = buildPool();
      const allocs = genAllocs();
      const userSp = procSpirit();

      // ==========================================================
      // 1. 정령 버프효율 분석표 생성 로직
      // ==========================================================
      const buffsArr = [
        {h:0, a:0, d:0}, {h:1, a:0, d:0}, {h:0, a:1, d:0}, {h:0, a:0, d:1},
        {h:2, a:0, d:0}, {h:0, a:2, d:0}, {h:0, a:0, d:2},
        {h:1, a:1, d:0}, {h:1, a:0, d:1}, {h:0, a:1, d:1}
      ];

      const allSpirits = generateAllSpirits();
      const allRowBVs = [];
      const userRowBVs = [];

      DTYPES.forEach((dt) => {
        const bs = BASE[simGrade][dt];
        const bh = bs.hp, ba = bs.atk, bd = bs.def;

        const envs = [];
        ownedAcc.forEach(acc => {
          ['hp','atk','def'].forEach(enc => {
            const aH = acc.hp + (enc==='hp'?0.21:0);
            const aA = acc.atk + (enc==='atk'?0.21:0);
            const aD = acc.def + (enc==='def'?0.21:0);
            pends.forEach(pend => {
              const {pH, pA, pD} = calcPendPct(pend);
              allocs.forEach(alloc => {
                let gH=0, gA=0, gD=0;
                for(let i=0; i<alloc.length; i++){
                  gH += alloc[i]*pool[i].h; gA += alloc[i]*pool[i].a; gD += alloc[i]*pool[i].d;
                }
                envs.push({
                   baseH: Math.floor((bh + gH + 24)*(1 + aH)),
                   baseA: Math.floor((ba + gA +  6)*(1 + aA)),
                   baseD: Math.floor((bd + gD +  6)*(1 + aD)),
                   pH, pA, pD
                });
              });
            });
          });
        });

        const BU_H = buffsArr.map(b => Math.floor(bh * 0.2) * b.h + COLL.hp);
        const BU_A = buffsArr.map(b => Math.floor(ba * 0.2) * b.a + COLL.atk);
        const BU_D = buffsArr.map(b => Math.floor(bd * 0.2) * b.d + COLL.def);

        const evalSpirit = (sp) => {
           const sp_pH = 1 + sp.pct.hp, sp_pA = 1 + sp.pct.atk, sp_pD = 1 + sp.pct.def;
           const sp_plusH = sp.plus.hp * sp_pH, sp_plusA = sp.plus.atk * sp_pA, sp_plusD = sp.plus.def * sp_pD;
           const sp_bH = sp.bonus.hp, sp_bA = sp.bonus.atk, sp_bD = sp.bonus.def;

           const maxBVs = new Float64Array(10);
           for(let j=0; j<envs.length; j++) {
               const env = envs[j];
               const s3H = Math.floor( (Math.floor(env.baseH * sp_pH + sp_plusH) + sp_bH) * (1 + env.pH) );
               const s3A = Math.floor( (Math.floor(env.baseA * sp_pA + sp_plusA) + sp_bA) * (1 + env.pA) );
               const s3D = Math.floor( (Math.floor(env.baseD * sp_pD + sp_plusD) + sp_bD) * (1 + env.pD) );

               for(let k=0; k<10; k++) {
                   const bv = (s3H + BU_H[k]) * (s3A + BU_A[k]) * (s3D + BU_D[k]);
                   if(bv > maxBVs[k]) maxBVs[k] = bv;
               }
           }

           const rows = new Float64Array(14);
           rows[0] = maxBVs[0];
           rows[1] = maxBVs[1]; rows[2] = maxBVs[2]; rows[3] = maxBVs[3];
           rows[4] = (maxBVs[1] + maxBVs[2] + maxBVs[3]) / 3;
           rows[5] = maxBVs[4]; rows[6] = maxBVs[5]; rows[7] = maxBVs[6];
           rows[8] = maxBVs[7]; rows[9] = maxBVs[8]; rows[10] = maxBVs[9];

           const b2Arr = [maxBVs[4], maxBVs[5], maxBVs[6], maxBVs[7], maxBVs[8], maxBVs[9]];
           b2Arr.sort((a, b) => b - a);

           rows[11] = (b2Arr[0] + b2Arr[1] + b2Arr[2] + b2Arr[3] + b2Arr[4] + b2Arr[5]) / 6;
           rows[12] = (b2Arr[0] + b2Arr[1] + b2Arr[2]) / 3;
           rows[13] = (b2Arr[3] + b2Arr[4] + b2Arr[5]) / 3;

           return rows;
        };

        userRowBVs.push(evalSpirit(userSp));
        const dtAllRows = new Float64Array(3888 * 14);
        for(let i=0; i<3888; i++) {
           const rows = evalSpirit(allSpirits[i]);
           for(let r=0; r<14; r++) { dtAllRows[i*14 + r] = rows[r]; }
        }
        allRowBVs.push(dtAllRows);
      });

      window.tableSimData = { userRowBVs, allRowBVs, mode: window.tableSimData ? window.tableSimData.mode : 'bv' };
      renderAnalysisTable();

      // ==========================================================
      // 2. 단일 조건 TOP 200 계산 로직
      // ==========================================================
      const exactBufObj = parseExactBuf(simExactBuf);
      const exactNerfObj = parseExactNerf(simExactNerf);
      const top200 = doSimExact(ownedAcc, exactBufObj, exactNerfObj, pends, pool, allocs);
      renderResTop(top200);

      const rs = document.getElementById('res-sec');
      rs.style.display = '';

    } catch(e) {
      console.error(e);
      alert('오류: ' + e.message);
    }
    if (btn) {
      btn.disabled = false;
      btn.textContent = '📊 일괄 시뮬레이션 연산 (분석표 + TOP 200)';
    }
  }, 30);
}

function doSimExact(ownedAcc, buf, nerf, pends, pool, allocs){
  const {plus:sP, pct:sPct, bonus:sB} = procSpirit();
  const topList = [];
  let minBV = -Infinity;

  const dt = simType; 
  const bs = BASE[simGrade][dt];
  const bh = bs.hp, ba = bs.atk, bd = bs.def;
  
  const finalH = Math.floor(bh * 0.2) * buf.h - Math.floor(bh * 0.2) * nerf.h;
  const finalA = Math.floor(ba * 0.2) * buf.a - Math.floor(ba * 0.2) * nerf.a;
  const finalD = Math.floor(bd * 0.2) * buf.d - Math.floor(bd * 0.2) * nerf.d;

  for(const acc of ownedAcc){
    for(const enc of ['hp','atk','def']){
      const aH = acc.hp + (enc==='hp'?0.21:0);
      const aA = acc.atk + (enc==='atk'?0.21:0);
      const aD = acc.def + (enc==='def'?0.21:0);
      
      for(const pend of pends){
        const {pH, pA, pD} = calcPendPct(pend);
        for(const alloc of allocs){
          let gH=0, gA=0, gD=0;
          for(let i=0; i<alloc.length; i++){
            gH += alloc[i]*pool[i].h; gA += alloc[i]*pool[i].a; gD += alloc[i]*pool[i].d;
          }
          
          const fH = calcStat(bh, gH, 24, aH, sPct.hp, pH, sP.hp, sB.hp, COLL.hp, finalH);
          const fA = calcStat(ba, gA, 6, aA, sPct.atk, pA, sP.atk, sB.atk, COLL.atk, finalA);
          const fD = calcStat(bd, gD, 6, aD, sPct.def, pD, sP.def, sB.def, COLL.def, finalD);
          const bv = fH * fA * fD;
          
          if(bv > minBV || topList.length < 500){
            let lo=0, hi=topList.length;
            while(lo < hi){ 
              const m = (lo + hi) >> 1; 
              if(topList[m].bv >= bv) lo = m + 1; 
              else hi = m; 
            }
            topList.splice(lo, 0, {
              bv, dt, accN:acc.n, enc, pend, 
              bufLabel: buf.label, nerfLabel: nerf.label,
              alloc:alloc.map((k,i)=>({k, g:pool[i]})).filter(x=>x.k>0), 
              fH, fA, fD
            });
            if(topList.length > 500) topList.pop(); 
            minBV = topList.length === 500 ? topList[499].bv : -Infinity;
          }
        }
      }
    }
  }
  return topList;
}

function renderResTop(topList){
  const el = document.getElementById('res-body-top');
  if(!topList.length){
    el.innerHTML='<div style="padding:30px;text-align:center;color:var(--dim)">결과 없음</div>';
    return;
  }
  const medals = ['🥇','🥈','🥉'];
  
  let html = '<div>'; 
  
  topList.forEach((r, i) => {
    const rank = i < 3 ? medals[i] : `<span class="rank-n">${i+1}</span>`;
    const dc = DCOLORS[r.dt];
    const a = ACC_DB.find(x => x.n === r.accN);
    const aImg = a && a.img ? `<img src="${a.img}" style="width:48px;height:48px;object-fit:contain;border-radius:5px">` : '';
    
    const formattedBv = (r.bv / 1e8).toFixed(3) + '억';
    const combinedBufHtml = fmtBufNerfLabel(r.bufLabel, r.nerfLabel);

    // 펜던트의 옵션 값들을 콤마로 연결해서 문자열로 만듭니다. (예: "hp,atk")
    const rawPend = r.pend ? r.pend.options.slice(0, r.pend.type==='태양'?3:2).map(o=>o.stat).join(',') : '';

    html += mkMobCard(rank, dc, r.dt, aImg, fmtAccName(r.accN), fmtAccEnc(r.enc),
      fmtGem(r.alloc), fmtPendMob(r.pend), combinedBufHtml,
      r.fH.toLocaleString('ko-KR'), r.fA.toLocaleString('ko-KR'), r.fD.toLocaleString('ko-KR'),
      formattedBv, r.accN, r.enc, rawPend);
  });
  
  html += '</div>';
  el.innerHTML = html;

  applyHighlight();
}

                <option value="hp">체력</option>
                <option value="atk">공격</option>
                <option value="def">방어</option>
             </select>
             
             <label style="display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer;">
                <input type="checkbox" id="hl-filter-cb" onchange="applyHighlight()" style="accent-color: var(--gold); cursor: pointer; width: 14px; height: 14px; margin: 0;">
                <span style="font-size: var(--ssfont); color: var(--dim); font-weight: 700; white-space: nowrap;">선택만 보기</span>
             </label>
         </div>
      </div>
    </div>
  `;

  const pType = S.pendType;
  const pImg = IMG_PEND[pType];
  const pName = pType === '태양' ? '태양펜' : '달펜';
  const numOpts = pType === '태양' ? 3 : 2;

  let pendSelects = '';
  for(let i=0; i<numOpts; i++) {
     pendSelects += `<select class="hl-pend-sel" onchange="applyHighlight()" style="width: 100%; background: var(--sf2); border: 1px solid var(--bd); color: var(--text); padding: 4px 2px; border-radius: 4px; font-weight: 800; outline: none; cursor: pointer; font-size: var(--ssfont); text-align: center; text-align-last: center; margin-top: 2px;">
        <option value="">옵션${i+1}</option>
        <option value="hp">체력</option>
        <option value="atk">공격</option>
        <option value="def">방어</option>
     </select>`;
  }

  let pendHtml = `
    <div style="display:flex; flex-direction:column; min-width: 0; flex: 0.65;">
      <div class="sec-hd" style="border-radius: 8px 8px 0 0; margin-bottom: 0; justify-content: center; letter-spacing: 0; font-size: var(--sfont); white-space: nowrap; padding: 9px 4px;">🔍 펜던트 조건</div>
      <div class="sec-bd" style="background: var(--sf); border: 1px solid var(--bd); border-top: none; border-radius: 0 0 8px 8px; flex: 1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap: clamp(4px, 1vw, 8px); padding: clamp(8px, 1.5vw, 14px) clamp(4px, 1vw, 8px);">
         
         <div style="width: clamp(38px, 8vw, 56px); height: clamp(38px, 8vw, 56px); border: 1px solid var(--bd); border-radius: 8px; overflow: hidden; background: var(--bg); display:flex; align-items:center; justify-content:center; margin-top: 2px;">
           <img src="${pImg}" style="width: 85%; height: 85%; object-fit: contain;">
         </div>
         <div style="font-size:var(--ssfont); color:var(--text); font-weight:800; text-align:center; word-break:keep-all;">${pName}</div>
         
         <div style="display:flex; flex-direction:column; width: 100%; gap: 1px; margin-top: auto;">
           ${pendSelects}
         </div>
      </div>
    </div>
  `;

  el.innerHTML = `<div style="--sfont: clamp(10px, 2.4vw, 14px); --ssfont: clamp(9px, 2vw, 12px); display: flex; gap: clamp(6px, 1.5vw, 10px); flex-wrap: nowrap;">
     <div style="flex: 1.1; min-width: 0; display:flex; flex-direction:column;">${spiritHtml}</div>
     ${hlHtml}
     ${pendHtml}
  </div>`;
  el.style.display = 'block';
}

function applyHighlight() {
   const accEl = document.getElementById('hl-acc-sel');
   const encEl = document.getElementById('hl-enc-sel');
   const filterCb = document.getElementById('hl-filter-cb');
   const imgEl = document.getElementById('hl-acc-img');
   const phEl = document.getElementById('hl-acc-placeholder');
   const textEl = document.getElementById('hl-acc-text');
   
   if(!accEl || !encEl) return;
   
   const accName = accEl.value;
   const encName = encEl.value;
   const onlyShow = filterCb ? filterCb.checked : false; // 체크박스 상태 확인
   
   // 선택된 펜던트 옵션들 배열화 (빈 값은 제외)
   const pendSels = Array.from(document.querySelectorAll('.hl-pend-sel')).map(el => el.value).filter(v => v);
   
   // 장신구 이미지 및 텍스트 업데이트
   if(!accName) {
      imgEl.style.display = 'none';
      phEl.style.display = 'flex';
      if(textEl) textEl.innerHTML = '장신구 선택'; 
   } else {
      const acc = ACC_DB.find(x => x.n === accName);
      if(acc && acc.img) {
         imgEl.src = acc.img;
         imgEl.style.display = 'block';
         phEl.style.display = 'none';
         if(textEl) textEl.innerHTML = `<span style="color:var(--text); font-weight:800;">${accName}</span>`;
      }
   }

   // 다중 조건 일치 여부에 따른 하이라이팅 및 필터링 적용
   const items = document.querySelectorAll('.res-item');
   items.forEach(el => {
      const itemAcc = el.getAttribute('data-acc');
      const itemEnc = el.getAttribute('data-enc');
      const itemPendAttr = el.getAttribute('data-pend');
      const itemPend = itemPendAttr ? itemPendAttr.split(',') : [];
      
      const matchAcc = !accName || itemAcc === accName;
      const matchEnc = !encName || itemEnc === encName;
      
      let matchPend = true;
      if(pendSels.length > 0) {
         let itemPendCopy = [...itemPend];
         for(let p of pendSels) {
            let idx = itemPendCopy.indexOf(p);
            if(idx >= 0) {
               itemPendCopy.splice(idx, 1);
            } else {
               matchPend = false;
               break; 
            }
         }
      }
      
      const hasCondition = accName || encName || pendSels.length > 0;
      const isMatch = matchAcc && matchEnc && matchPend;
      
      // 1. 하이라이팅 적용 (조건이 있고 일치할 때)
      if(hasCondition && isMatch) {
         el.style.backgroundColor = 'rgba(232, 184, 75, 0.25)'; 
         el.style.boxShadow = 'inset 0 0 0 2px rgba(232, 184, 75, 0.8)';
      } else {
         el.style.backgroundColor = ''; 
         el.style.boxShadow = '';
      }
      
      // 2. 필터링 (숨김) 적용
      if(onlyShow && hasCondition) {
         // 체크박스가 켜져있고 검색 조건이 하나라도 있으면, 일치하는 것만 표시
         el.style.display = isMatch ? 'block' : 'none';
      } else {
         // 체크박스가 꺼져있거나 검색 조건이 전혀 없으면 모두 표시
         el.style.display = 'block'; 
      }
   });
}
document.addEventListener('DOMContentLoaded', doLoad);
</script>
</body>
</html>
