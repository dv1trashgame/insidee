<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSIDE 통합 포털</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* 원본 페이지와 동일한 색상 및 폰트 변수 설정 */
:root {
  --bg:#f5f5f5; --bg2:#ffffff; --bg3:#ebebeb;
  --border:#d5d5d5; --border2:#cccccc; --border3:#e0e0e0;
  --text:#333333; --text2:#555555; --text3:#666666; --text4:#999999;
  --accent:#3b4890; --accent-bg:rgba(59,72,144,0.12);
  
  --sf:var(--bg2); --sf2:var(--bg3); --bd:var(--border);
  --gold:var(--accent); --gold2:#4a5a9f;
  --dim:var(--text3);
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nanum Gothic',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* 상단 헤더 UI */
.hd{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--sf);border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:100}
.hd-icon{font-size:26px}.hd-t{font-size:15px;font-weight:800;color:var(--gold)}.hd-s{font-size:11px;color:var(--dim);margin-top:2px}

/* 메인 컨테이너 */
.container { max-width: 820px; margin: 40px auto; padding: 0 20px; }

/* 안내 배너 UI */
.notice-sec {
    background: var(--sf2);
    border: 1px solid var(--bd);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 24px;
    text-align: center;
    font-size: 14px;
    color: var(--text);
    font-weight: 700;
}
.notice-sec strong { color: var(--gold); font-weight: 800; }

/* 링크 버튼 그리드 구성 */
.menu-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media(min-width: 600px) { .menu-grid { grid-template-columns: 1fr 1fr; } }

/* 링크 카드 UI */
.menu-card {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: var(--sf);
    border: 1px solid var(--bd);
    border-radius: 8px;
    padding: 48px 20px;
    text-decoration: none;
    transition: all 0.2s ease;
}

.menu-card:hover {
    border-color: var(--gold);
    background: var(--accent-bg);
    transform: translateY(-3px);
    box-shadow: 0 6px 12px rgba(59,72,144,0.1);
}

.menu-icon {
    font-size: 46px;
    margin-bottom: 20px;
}

.menu-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--gold);
    margin-bottom: 10px;
}

.menu-desc {
    font-size: 14px;
    color: var(--dim);
    font-weight: 700;
    text-align: center;
    word-break: keep-all;
}
</style>
</head>
<body>

<!-- 상단 헤더 바 -->
<div class="hd">
  <div class="hd-icon">🐉</div>
  <div>
    <div class="hd-t">INSIDE 포털</div>
    <div class="hd-s">통합 메인 홈페이지</div>
  </div>
</div>

<div class="container">
  
  <!-- 안내 배너 -->
  <div class="notice-sec">
     원하시는 메뉴를 선택해주세요.<br>
     클릭 시 <strong>해당 페이지</strong>로 즉시 이동합니다.
  </div>
  
  <!-- 메뉴 선택 영역 -->
  <div class="menu-grid">
    <!-- 첫 번째 칸: cal.html 링크 -->
    <a href="cal.html" class="menu-card">
      <div class="menu-icon">📊</div>
      <div class="menu-title">INSIDE 계산기</div>
      <div class="menu-desc">정령 티어 분석표 및 세팅 계산 결과 확인</div>
    </a>
    
    <!-- 두 번째 칸: great.html 링크 -->
    <a href="great.html" class="menu-card">
      <div class="menu-icon">✨</div>
      <div class="menu-title">Great 페이지</div>
      <div class="menu-desc">기타 부가 기능 및 추가 메뉴 이동</div>
    </a>
  </div>

</div>

</body>
</html>
