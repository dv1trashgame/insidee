<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>길드 매치 스탯 계산기</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; max-width: 800px; margin: 0 auto; padding: 30px 20px; background-color: #1e1e1e; color: #e0e0e0; line-height: 1.6; }
        h2 { color: #ffffff; text-align: center; font-weight: 800; margin-bottom: 30px; letter-spacing: -0.5px; }
        
        .upload-section, .result-section { background: #252525; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); margin-bottom: 25px; border: 1px solid #333; }
        
        #imagePreview { width: 100%; height: auto; margin-top: 15px; border-radius: 8px; display: none; border: 1px solid #444; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        button { background: #5c9d46; color: white; padding: 16px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 20px; font-weight: bold; width: 100%; box-shadow: 0 4px 10px rgba(92, 157, 70, 0.2); transition: all 0.2s ease; }
        button:hover { background: #4d8639; transform: translateY(-2px); }
        button:disabled { background: #333333; box-shadow: none; transform: none; cursor: not-allowed; color: #666666; }
        #status { margin-top: 20px; color: #94a3b8; font-weight: bold; text-align: center; font-size: 15px; }
        
        .stat-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 15px 20px; border-radius: 8px; border: 1px solid #444; }
        .stat-label { font-size: 16px; font-weight: bold; color: #cbd5e1; display: flex; align-items: center; gap: 8px; }
        .stat-formula { font-size: 15px; color: #94a3b8; }
        .stat-sum { font-size: 20px; font-weight: 900; color: #ffffff; }
        
        .stat-hp .stat-label { color: #ff8a8a; }
        .stat-hp .stat-sum { color: #fca5a5; }
        .stat-atk .stat-label { color: #ffa756; }
        .stat-atk .stat-sum { color: #fdba74; }
        .stat-def .stat-label { color: #6ee7b7; }
        .stat-def .stat-sum { color: #a7f3d0; }

        .total-bival-box { background: linear-gradient(135deg, #ef4444, #f97316); color: white; padding: 25px; border-radius: 12px; text-align: center; margin-top: 15px; font-size: 20px; font-weight: 900; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .total-bival-box span { font-size: 36px; display: block; margin-top: 8px; color: #fef08a; letter-spacing: 1px; }

        .toggle-debug-btn { background: transparent; border: 1px solid #555; color: #94a3b8; padding: 6px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; margin-top: 10px; width: auto; transition: all 0.2s; }
        .toggle-debug-btn:hover { background: #333; color: #fff; border-color: #777; }
    </style>
</head>
<body>

    <h2>⚔️ 상대방 스탯 (비밸) 계산기</h2>

    <div class="upload-section">
        <p style="margin-top:0; font-weight:800; color: #e2e8f0; font-size:15px; margin-bottom:12px;">1. 길드 매치 화면 스크린샷 업로드 (우측 하단 인식)</p>
        <input type="file" id="imageInput" accept="image/*">
        
        <img id="imagePreview" alt="원본 이미지">

        <button id="extractBtn" disabled>2. 스탯 추출 및 계산하기</button>
        <div id="status"></div>
    </div>

    <div class="result-section" id="resultSection" style="display: none;">
        <h3 style="margin-top:0; color:#ffffff; font-weight:800; font-size:18px; border-bottom:1px solid #444; padding-bottom:12px; margin-bottom:20px;">계산 결과</h3>
        
        <div id="parsedResults"></div>
        
        <div style="text-align: center; margin-top: 30px;">
            <button class="toggle-debug-btn" onclick="const w = document.getElementById('debugImageWrapper'); w.style.display = w.style.display === 'none' ? 'block' : 'none'; this.innerText = w.style.display === 'none' ? '인식 영역 이미지 보기 ▼' : '인식 영역 이미지 닫기 ▲';">인식 영역 이미지 보기 ▼</button>
            <div id="debugImageWrapper" style="display: none; margin-top: 15px;">
                <img id="debugImg" style="max-width: 100%; border: 1px solid #444; border-radius: 8px;">
                <textarea id="rawText" style="width: 100%; height: 60px; background: #1e1e1e; color: #cbd5e1; border: 1px solid #444; border-radius: 6px; padding: 10px; margin-top: 10px;" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        // 1. 이미지를 잘라내고 흑백 대비를 줘서 OCR 인식률을 극대화하는 함수
        function preprocessImageForOCR(imgSrc) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    // 우측 하단 스탯 박스 영역만 크롭 (비율 기반 좌표 설정)
                    const cropLeft = Math.floor(img.width * 0.61);
                    const cropTop = Math.floor(img.height * 0.78);
                    const cropRight = Math.floor(img.width * 0.88);
                    const cropBottom = Math.floor(img.height * 0.94);
                    const cropW = cropRight - cropLeft;
                    const cropH = cropBottom - cropTop;

                    const scale = 4; // 글자를 키워 인식률 향상
                    const pad = 20;
                    const canvas = document.createElement('canvas');
                    canvas.width = cropW * scale + pad * 2;
                    canvas.height = cropH * scale + pad * 2;
                    const ctx = canvas.getContext('2d');

                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.imageSmoothingEnabled = false;
                    
                    // 크롭한 이미지를 캔버스에 그리기
                    ctx.drawImage(img, cropLeft, cropTop, cropW, cropH, pad, pad, cropW * scale, cropH * scale);

                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    
                    // Tesseract는 흰 배경에 검은 글씨를 가장 잘 읽으므로 색상 반전 및 이진화 처리
                    for (let i = 0; i < data.length; i += 4) {
                        let r = data[i], g = data[i+1], b = data[i+2];
                        let brightness = (r * 299 + g * 587 + b * 114) / 1000;
                        
                        // 밝은 글씨(흰색, 분홍색, 파란색 등)를 검은색으로 변경
                        if (brightness > 130 || (r > 150 && g < 150 && b > 150)) { 
                            data[i] = data[i+1] = data[i+2] = 0; // Black
                        } else {
                            data[i] = data[i+1] = data[i+2] = 255; // White
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.src = imgSrc;
            });
        }

        // 2. OCR로 읽은 텍스트에서 숫자+(숫자) 패턴을 추출하는 함수
        function parseStatsFromOCRText(rawOCR) {
            let text = rawOCR.replace(/[Ss]/g, '5').replace(/B/g, '8').replace(/[OoDdQqg]/g, '0');
            text = text.replace(/[MNm]/g, '11').replace(/[Il|]/g, '1');

            // "숫자 + (숫자)" 정규식 패턴 (OCR 오류로 +가 t로 읽히거나 괄호가 깨지는 경우 대비)
            const regex = /(\d+)\s*[+tT-]\s*[({[<|l]?\s*(\d+)\s*[)}\]>|l]?/g;
            let matches = [...text.matchAll(regex)];
            
            if (matches.length >= 3) {
                return {
                    hp: { base: parseInt(matches[0][1]), bonus: parseInt(matches[0][2]) },
                    atk: { base: parseInt(matches[1][1]), bonus: parseInt(matches[1][2]) },
                    def: { base: parseInt(matches[2][1]), bonus: parseInt(matches[2][2]) }
                };
            }

            // 패턴 매칭 실패 시 숫자만 전부 추출 후 마지막 6개(체,공,방 기본/추가)를 강제 할당
            let allNums = (text.match(/\d+/g) || []).map(n => parseInt(n, 10));
            if (allNums.length >= 6) {
                let nums = allNums.slice(-6); 
                return {
                    hp: { base: nums[0], bonus: nums[1] },
                    atk: { base: nums[2], bonus: nums[3] },
                    def: { base: nums[4], bonus: nums[5] }
                };
            }
            return null;
        }

        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const extractBtn = document.getElementById('extractBtn');
        const statusDiv = document.getElementById('status');
        const resultSection = document.getElementById('resultSection');
        const parsedResults = document.getElementById('parsedResults');
        const debugImg = document.getElementById('debugImg');
        const rawText = document.getElementById('rawText');

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                    extractBtn.disabled = false;
                    statusDiv.innerHTML = "계산 준비 완료 ✅";
                    resultSection.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        extractBtn.addEventListener('click', async () => {
            extractBtn.disabled = true;
            statusDiv.innerHTML = "우측 하단 영역 스탯 인식 중... ⏳";
            parsedResults.innerHTML = '';
            
            try {
                // 전처리 이미지 생성
                const processedImgSrc = await preprocessImageForOCR(imagePreview.src);
                debugImg.src = processedImgSrc;

                // Tesseract OCR 구동
                const worker = await Tesseract.createWorker('eng');
                await worker.setParameters({ tessedit_pageseg_mode: '6' }); 
                const ret = await worker.recognize(processedImgSrc);
                await worker.terminate();
                
                rawText.value = ret.data.text;
                const stats = parseStatsFromOCRText(ret.data.text);
            
                if (stats) {
                    statusDiv.innerHTML = "계산 완료 ✅";
                    statusDiv.style.color = "#4ade80"; 

                    // 합산 및 곱연산
                    const totalHp = stats.hp.base + stats.hp.bonus;
                    const totalAtk = stats.atk.base + stats.atk.bonus;
                    const totalDef = stats.def.base + stats.def.bonus;
                    const finalBival = totalHp * totalAtk * totalDef;

                    // 결과 HTML 렌더링
                    parsedResults.innerHTML = `
                        <div class="stat-container">
                            <div class="stat-row stat-hp">
                                <div class="stat-label">♥ 체력</div>
                                <div class="stat-formula">${stats.hp.base} + ${stats.hp.bonus} = </div>
                                <div class="stat-sum">${totalHp.toLocaleString()}</div>
                            </div>
                            <div class="stat-row stat-atk">
                                <div class="stat-label">⚔ 공격력</div>
                                <div class="stat-formula">${stats.atk.base} + ${stats.atk.bonus} = </div>
                                <div class="stat-sum">${totalAtk.toLocaleString()}</div>
                            </div>
                            <div class="stat-row stat-def">
                                <div class="stat-label">🛡 방어력</div>
                                <div class="stat-formula">${stats.def.base} + ${stats.def.bonus} = </div>
                                <div class="stat-sum">${totalDef.toLocaleString()}</div>
                            </div>
                        </div>
                        
                        <div class="total-bival-box">
                            🏆 최종 종합 비밸
                            <span>${finalBival.toLocaleString()}</span>
                        </div>
                    `;
                } else {
                    parsedResults.innerHTML = `
                        <div style="background:#3a1616; color:#fca5a5; padding:15px; border-radius:8px; text-align:center; font-weight:bold;">
                            ❌ 스탯을 인식하지 못했습니다.<br>우측 하단의 스탯 영역(빨간 게이지 아래)이 잘 보이는지 확인해 주세요.
                        </div>
                    `;
                    statusDiv.innerHTML = "인식 실패 ❌";
                    statusDiv.style.color = "#fca5a5"; 
                }
                
                resultSection.style.display = 'block';

            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = "오류가 발생했습니다.";
            } finally {
                extractBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
