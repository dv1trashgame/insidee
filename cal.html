<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSIDE 스탯 계산기</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           great.html 기준 테마 및 공통 CSS
           ========================================= */
        :root {
            --bg: #f5f5f5; --bg2: #ffffff; --bg3: #ebebeb;
            --border: #d5d5d5; --border2: #cccccc; --border3: #e0e0e0;
            --text: #333333; --text2: #555555; --text3: #666666; --text4: #999999;
            --accent: #3b4890; --accent-bg: rgba(59,72,144,0.12); --accent-border: rgba(59,72,144,0.30);
            
            --sf: var(--bg2); --sf2: var(--bg3); --bd: var(--border);
            --gold: var(--accent); --gold2: var(--accent);
            --dim: var(--text3); --dimmer: var(--text4);
            --red: #f87171; --green: #4ade80; --blue: #60a5fa;
            --hpc: #fbbf24; --atc: #f87171; --dfc: #60a5fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Nanum Gothic', -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            min-height: 100vh; 
            font-size: 14px; 
            overflow-x: hidden;
        }

        /* 헤더 스타일 (great.html) */
        .hd {
            display: flex; align-items: center; justify-content: space-between; 
            padding: 12px 20px; background: var(--sf); 
            border-bottom: 2px solid var(--gold); 
            position: sticky; top: 0; z-index: 100;
        }
        .hd-left { display: flex; align-items: center; gap: 14px; }
        .hd-icon {
            width: 32px; height: 32px; flex-shrink: 0; border-radius: 4px;
            background-color: var(--border3); overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        .hd-icon img { width: 100%; height: 100%; object-fit: cover; }
        .hd-t { font-size: 15px; font-weight: 800; color: var(--gold); }
        .hd-s { font-size: 11px; color: var(--dim); margin-top: 2px; }
        
        /* 공통 버튼 스타일 */
        .btn-sim {
            width: 100%; padding: 14px; 
            background: linear-gradient(135deg, var(--gold2), var(--gold)); 
            border: none; border-radius: 8px; color: #ffffff; 
            font-family: 'Nanum Gothic', sans-serif; font-size: 16px; 
            font-weight: 800; cursor: pointer; margin: 12px 0; 
            letter-spacing: -.5px; transition: opacity .15s, transform .1s;
        }
        .btn-sim:hover { opacity: .92; }
        .btn-sim:active { transform: scale(.99); }
        .btn-sim:disabled { opacity: .5; cursor: not-allowed; }

        /* 메인 컨테이너 (820px 제한, 중앙 정렬) */
        .main-container {
            max-width: 820px; margin: 20px auto; padding: 0 14px;
        }

        /* 콘텐츠 박스 (great.html의 .sec-bd / 폼 요소 스타일링) */
        .content-box {
            background: var(--sf); border: 1px solid var(--bd); 
            border-radius: 8px; padding: 20px; margin-bottom: 14px;
        }
        
        .box-title {
            font-weight: 800; color: var(--gold); font-size: 15px; margin-bottom: 12px;
        }

        /* 입력 폼 셋팅 */
        select, input[type=text], input[type=file] {
            background: var(--sf2); border: 1px solid var(--bd); color: var(--text); 
            padding: 8px 12px; border-radius: 5px; font-family: 'Nanum Gothic', sans-serif; 
            font-size: 13px; font-weight: 700; width: 100%; box-sizing: border-box; outline: none;
        }
        select:focus, input:focus { border-color: var(--gold); }

        /* 상태 알림창 */
        #sysNotice {
            background: rgba(59,72,144,0.1); border: 1px solid var(--accent-border); 
            color: var(--accent); padding: 12px; border-radius: 8px; 
            text-align: center; font-size: 13px; font-weight: 800; margin-bottom: 14px;
        }

        /* 결과/입력 그리드 구조 (기존 cal.html 대응) */
        .groups-wrapper, .pre-select-container { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; 
        }
        .pre-select-item { 
            background: var(--sf2); padding: 12px; border-radius: 6px; border: 1px solid var(--bd); 
        }
        .pre-select-item label { 
            display: block; font-weight: 800; color: var(--dim); font-size: 13px; text-align: center; margin-bottom: 8px; 
        }
        
        .autocomplete-wrapper { position: relative; width: 100%; margin-bottom: 6px; }
        .autocomplete-list { 
            position: absolute; top: calc(100% + 4px); left: 0; right: 0; 
            background: var(--sf); border: 1px solid var(--gold); z-index: 1000; 
            max-height: 200px; overflow-y: auto; border-radius: 6px; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .autocomplete-item { 
            padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--bd); font-size: 13px; color: var(--text); font-weight: 700;
        }
        .autocomplete-item:hover { background-color: var(--sf2); color: var(--gold); }

        #imagePreview { width: 100%; border-radius: 8px; display: none; border: 1px solid var(--bd); margin-top: 10px; }
        
        /* 모달 스타일 (great.html 테마 기반 수정) */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(2px); }
        .modal-content { 
            background-color: var(--sf); margin: 10% auto; padding: 25px; 
            border: 1px solid var(--bd); border-radius: 12px; width: 95%; max-width: 820px; 
            max-height: 80vh; overflow-y: auto; color: var(--text); position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
        }
        .close-btn { color: var(--dim); float: right; font-size: 28px; font-weight: bold; cursor: pointer; line-height: 1; margin-top: -5px; }
        .close-btn:hover { color: var(--gold); }

        /* 분석표 형식 랭킹 테이블 */
        .rank-table { 
            width: 100%; table-layout: fixed; border-collapse: collapse; border: 2px solid var(--gold); 
            text-align: center; font-size: 12px; font-family: 'Nanum Gothic', sans-serif; white-space: nowrap; 
        }
        .rank-table th { background: var(--gold); color: #ffffff; padding: 8px 4px; font-weight: 800; border: 1px solid var(--gold); }
        .rank-table td { padding: 10px 4px; border-bottom: 1px solid var(--border); background: var(--bg3); font-weight: 700; color: var(--text); vertical-align: middle; }
        
        .detail-toggle-btn { background: var(--sf2); color: var(--dim); border: 1px solid var(--bd); padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 800; cursor: pointer; }
        .detail-toggle-btn:hover { background: rgba(59,72,144,0.1); border-color: var(--gold); color: var(--gold); }
        .details-row td { background: var(--sf) !important; padding: 15px; border-bottom: 2px solid var(--gold); }
        
        /* 모바일 대응 */
        @media (max-width: 600px) {
            .groups-wrapper, .pre-select-container { grid-template-columns: 1fr; }
            .hd-t { font-size: 13px; }
            .btn-sim { font-size: 14px; padding: 10px; }
        }
    </style>
</head>
<body>

    <!-- great.html 스타일 헤더 -->
    <div class="hd">
        <div class="hd-left">
            <div class="hd-icon">
                <img src="images/logo.png" alt="로고" onerror="this.style.display='none'">
            </div>
            <div>
                <div class="hd-t">INSIDE 스탯 계산기</div>
                <div class="hd-s">스탯 인식 및 랭킹 관리</div>
            </div>
        </div>
        <button id="openLeaderboardBtn" class="btn-sim" style="width:auto; margin:0; padding: 8px 12px; font-size: 12px; border-radius: 6px;">🏆 랭킹 (순위표)</button>
    </div>

    <!-- 메인 컨테이너 -->
    <div class="main-container">
        
        <div id="sysNotice">데이터베이스 파일들을 불러오는 중입니다... ⏳</div>

        <!-- 이미지 업로드 섹션 -->
        <div class="content-box">
            <div class="box-title">1. 덱 설정 화면 스크린샷 업로드</div>
            <input type="file" id="imageInput" accept="image/*">
            <img id="imagePreview" alt="원본 이미지">
        </div>
        
        <!-- 드래곤 지정 섹션 -->
        <div id="preSelectArea" class="content-box" style="display: none;">
            <div class="box-title">2. 각 그룹의 드래곤과 등급 지정</div>
            <div class="pre-select-container">
                <div class="pre-select-item">
                    <label>그룹 1 (좌측)</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" class="dragon-search" id="preInput1" autocomplete="off" placeholder="이름 검색">
                        <div class="autocomplete-list" id="autoList1"></div>
                    </div>
                    <select class="grade-select" id="preGrade1">
                        <option value="7.0">7.0</option><option value="8.0">8.0</option><option value="9.0" selected>9.0</option>
                    </select>
                </div>
                <div class="pre-select-item">
                    <label>그룹 2 (중앙)</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" class="dragon-search" id="preInput2" autocomplete="off" placeholder="이름 검색">
                        <div class="autocomplete-list" id="autoList2"></div>
                    </div>
                    <select class="grade-select" id="preGrade2">
                        <option value="7.0">7.0</option><option value="8.0">8.0</option><option value="9.0" selected>9.0</option>
                    </select>
                </div>
                <div class="pre-select-item">
                    <label>그룹 3 (우측)</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" class="dragon-search" id="preInput3" autocomplete="off" placeholder="이름 검색">
                        <div class="autocomplete-list" id="autoList3"></div>
                    </div>
                    <select class="grade-select" id="preGrade3">
                        <option value="7.0">7.0</option><option value="8.0">8.0</option><option value="9.0" selected>9.0</option>
                    </select>
                </div>
            </div>
            
            <button id="extractBtn" class="btn-sim" disabled>3. 스탯 계산하기</button>
            <div id="status" style="text-align: center; color: var(--dim); font-weight: 800; font-size: 13px;"></div>
        </div>

        <!-- 결과 출력 섹션 -->
        <div class="content-box" id="resultSection" style="display: none;">
            <div class="box-title" style="border-bottom: 1px solid var(--bd); padding-bottom: 10px;">이번 주 비밸 계산 결과</div>
            <div id="parsedResults" style="margin-top: 14px;"></div>
            
            <h4 style="margin-top: 20px; font-size: 12px; color: var(--dim); margin-bottom:5px;">전체 인식된 텍스트 (로그 확인용)</h4>
            <textarea id="rawText" style="width: 100%; height: 60px; background: var(--sf2); color: var(--dim); border: 1px solid var(--bd); border-radius: 6px; padding: 10px; font-size: 11px;" readonly></textarea>
        </div>

    </div>

    <!-- 랭킹 모달 -->
    <div id="leaderboardModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            <h3 style="margin-top: 0; color: var(--gold); text-align: center; font-weight: 900; margin-bottom: 14px;">🏆 주간 랭킹 (순위표)</h3>
            <div style="overflow-x: auto;">
                <table class="rank-table">
                    <thead>
                        <tr>
                            <th style="width: 13%;">순위</th>
                            <th style="width: 33%;">닉네임 & 덱</th>
                            <th style="width: 14%;">버프</th>
                            <th style="width: 26%;">총합 비밸</th>
                            <th style="width: 14%;">상세</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 원본 JS 논리 완벽 보존 (연산, OCR 등 변경 안 함)
        // 화면에 뿌려주는 innerHTML 스타일 요소만 great.html 테마로 변경
        // ==========================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzcC8qd7_MQrkipdMO-jAwsKSYzaphxUgbOeTcecK3ENdg1ooLr5pa76VHX9KmdI0Gdtw/exec";

        let dragonDB = {};
        let dragonList = [];
        let weeklyData = { base_stats: {}, buff: [], nerf: [] };
        
        let currentCalculatedBival = 0; 
        let currentTotalBuffCount = 0;
        let currentTotalNerfCount = 0; 
        
        let currentG1 = {}, currentG2 = {}, currentG3 = {}; 

        const modal = document.getElementById("leaderboardModal");
        const btn = document.getElementById("openLeaderboardBtn");
        const span = document.getElementById("closeModalBtn");

        btn.onclick = function() { modal.style.display = "block"; loadLeaderboard(); }
        span.onclick = function() { modal.style.display = "none"; }
        window.onclick = function(event) { if (event.target == modal) { modal.style.display = "none"; } }

        function toggleDetails(btnElement) {
            const detailRow = btnElement.closest('tr').nextElementSibling;
            if (detailRow.style.display === "none" || detailRow.style.display === "") {
                detailRow.style.display = "table-row";
                btnElement.innerText = "닫기 ▲";
            } else {
                detailRow.style.display = "none";
                btnElement.innerText = "상세 ▼";
            }
        }

        async function loadLeaderboard() {
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = `<tr><td colspan="5" style="color:var(--dim);">데이터를 불러오는 중입니다... ⏳</td></tr>`;
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                
                tbody.innerHTML = '';
                if(data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="color:var(--dim);">아직 등록된 랭킹이 없습니다.</td></tr>`;
                    return;
                }

                data.forEach((row, index) => {
                    let medalHtml = `<span style="font-weight:900; color:var(--text);">${index + 1}위</span>`;
                    if(index === 0) medalHtml = `<span style="font-weight:900; color:#fbbf24;">1위</span>`;
                    if(index === 1) medalHtml = `<span style="font-weight:900; color:#9ca3af;">2위</span>`;
                    if(index === 2) medalHtml = `<span style="font-weight:900; color:#d97706;">3위</span>`;
                    let iconsHtml = '';
                    const dNames = [row.g1?.name, row.g2?.name, row.g3?.name];
                    dNames.forEach(dName => {
                        if(dName && !dName.startsWith("그룹 ")) {
                            iconsHtml += `<img src="./images/icons/${dName}.png" style="width:20px; height:20px; border-radius:4px; margin: 0 2px; object-fit:cover;" onerror="this.style.display='none'">`;
                        }
                    });
                    
                    const buffCount = row.totalBuffCount || 0;
                    const nerfCount = row.totalNerfCount || 0;

                    let buffText = "";
                    if (buffCount > 0 && nerfCount > 0) buffText = `${buffCount}-${nerfCount}버프`;
                    else if (buffCount === 0 && nerfCount > 0) buffText = `${nerfCount}너프`;
                    else buffText = `${buffCount}버프`;

                    const buffBadge = `<span style="padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 800; background: rgba(59,72,144,0.1); border: 1px solid var(--accent-border); color: var(--gold);">${buffText}</span>`;
                    const bivalText = `<span style="color:var(--gold); font-weight:900; font-size:14px;">${Number(row.score).toLocaleString()}</span>`;
                    
                    const calcBival = (g) => {
                        if(!g || !g.base_hp) return 0;
                        return (Number(g.base_hp) + Number(g.buff_hp)) * (Number(g.base_atk) + Number(g.buff_atk)) * (Number(g.base_def) + Number(g.buff_def));
                    };
                    const g1Bival = calcBival(row.g1);
                    const g2Bival = calcBival(row.g2);
                    const g3Bival = calcBival(row.g3);

                    const calcEval = (g) => {
                        if(!g || !g.base_hp) return 0;
                        return Number(g.base_hp) + (Number(g.base_atk) + Number(g.base_def)) * 4;
                    };
                    const g1Eval = calcEval(row.g1);
                    const g2Eval = calcEval(row.g2);
                    const g3Eval = calcEval(row.g3);
                    const totalEval = g1Eval + g2Eval + g3Eval;

                    const renderDragonName = (name) => {
                        if (!name || name === '-') return `🐲 -`;
                        return `<img src="./images/icons/${name}.png" style="width:16px; height:16px; border-radius:3px; vertical-align:middle; margin-right:4px;" onerror="this.style.display='none'"><span style="color:var(--text); font-weight:800;">${name}</span>`;
                    };

                    const formatDetailStat = (icon, base, buff, colorVar) => {
                        let buffHtml = '';
                        if (buff > 0) buffHtml = `<span style="color:var(--green); font-size:10px; font-weight:800;">(+${buff})</span>`;
                        else if (buff < 0) buffHtml = `<span style="color:var(--red); font-size:10px; font-weight:800;">(${buff})</span>`;
                        else buffHtml = `<span style="visibility:hidden; font-size:10px;">(+0)</span>`;
                        
                        return `
                        <div style="display:flex; flex-direction:column; align-items:center; line-height:1.2;">
                            <span style="font-size:11px; color:var(--dim); font-weight:800;">${icon}</span>
                            <b style="font-size:13px; color:var(${colorVar});">${base || 0}</b>
                            ${buffHtml}
                        </div>`;
                    };

                    tbody.innerHTML += `
                        <tr>
                            <td>${medalHtml}</td>
                            <td>
                                <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
                                    <span style="font-weight:800; color:var(--text); font-size:13px;">${row.nickname}</span>
                                    <div>${iconsHtml}</div>
                                </div>
                            </td>
                            <td>${buffBadge}</td>
                            <td>${bivalText}</td>
                            <td><button class="detail-toggle-btn" onclick="toggleDetails(this)">상세 ▼</button></td>
                        </tr>
                        <tr class="details-row" style="display:none;">
                            <td colspan="5">
                                <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
                                    <!-- 그룹 1 -->
                                    <div style="background:var(--sf2); border:1px solid var(--bd); border-radius:6px; padding:10px; flex:1; min-width:140px;">
                                        <div style="margin-bottom:8px;">${renderDragonName(row.g1?.name)}</div>
                                        <div style="display:flex; justify-content:space-around; border-bottom: 1px solid var(--border); padding-bottom:6px; margin-bottom:6px;">
                                            ${formatDetailStat('HP', row.g1?.base_hp, row.g1?.buff_hp, '--hpc')}
                                            ${formatDetailStat('ATK', row.g1?.base_atk, row.g1?.buff_atk, '--atc')}
                                            ${formatDetailStat('DEF', row.g1?.base_def, row.g1?.buff_def, '--dfc')}
                                        </div>
                                        <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:800;">
                                            <span style="color:var(--dim);">Eval: ${g1Eval.toLocaleString()}</span>
                                            <span style="color:var(--gold);">📊 ${g1Bival.toLocaleString()}</span>
                                        </div>
                                    </div>
                                    <!-- 그룹 2 -->
                                    <div style="background:var(--sf2); border:1px solid var(--bd); border-radius:6px; padding:10px; flex:1; min-width:140px;">
                                        <div style="margin-bottom:8px;">${renderDragonName(row.g2?.name)}</div>
                                        <div style="display:flex; justify-content:space-around; border-bottom: 1px solid var(--border); padding-bottom:6px; margin-bottom:6px;">
                                            ${formatDetailStat('HP', row.g2?.base_hp, row.g2?.buff_hp, '--hpc')}
                                            ${formatDetailStat('ATK', row.g2?.base_atk, row.g2?.buff_atk, '--atc')}
                                            ${formatDetailStat('DEF', row.g2?.base_def, row.g2?.buff_def, '--dfc')}
                                        </div>
                                        <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:800;">
                                            <span style="color:var(--dim);">Eval: ${g2Eval.toLocaleString()}</span>
                                            <span style="color:var(--gold);">📊 ${g2Bival.toLocaleString()}</span>
                                        </div>
                                    </div>
                                    <!-- 그룹 3 -->
                                    <div style="background:var(--sf2); border:1px solid var(--bd); border-radius:6px; padding:10px; flex:1; min-width:140px;">
                                        <div style="margin-bottom:8px;">${renderDragonName(row.g3?.name)}</div>
                                        <div style="display:flex; justify-content:space-around; border-bottom: 1px solid var(--border); padding-bottom:6px; margin-bottom:6px;">
                                            ${formatDetailStat('HP', row.g3?.base_hp, row.g3?.buff_hp, '--hpc')}
                                            ${formatDetailStat('ATK', row.g3?.base_atk, row.g3?.buff_atk, '--atc')}
                                            ${formatDetailStat('DEF', row.g3?.base_def, row.g3?.buff_def, '--dfc')}
                                        </div>
                                        <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:800;">
                                            <span style="color:var(--dim);">Eval: ${g3Eval.toLocaleString()}</span>
                                            <span style="color:var(--gold);">📊 ${g3Bival.toLocaleString()}</span>
                                        </div>
                                    </div>
                                </div>
                                <div style="margin-top: 10px; text-align: center; font-size: 13px; font-weight: 800; color: var(--text);">
                                    Eval 총합: <span style="color:var(--gold); font-size:15px;">${totalEval.toLocaleString()}</span>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="5" style="color:var(--red);">순위표를 불러오는 데 실패했습니다.</td></tr>`;
            }
        }

        async function submitScoreToDB() {

        // OCR 전처리 함수 원본 유지
        function preprocessImageForOCR(imgSrc) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = img.width;
                    tempCanvas.height = img.height;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.drawImage(img, 0, 0);
                    const tempData = tempCtx.getImageData(0, 0, img.width, img.height).data;

                    const rowBrightness = new Float32Array(img.height);
                    const startX = Math.floor(img.width * 0.3);
                    const endX = Math.floor(img.width * 0.7);
                    const scanWidth = endX - startX;

                    for (let y = 0; y < img.height; y++) {
                        let sum = 0;
                        for (let x = startX; x < endX; x++) {
                            const i = (y * img.width + x) * 4;
                            sum += 0.299 * tempData[i] + 0.587 * tempData[i+1] + 0.114 * tempData[i+2];
                        }
                        rowBrightness[y] = sum / scanWidth;
                    }

                    const safeTop = Math.floor(img.height * 0.15);
                    const safeBottom = Math.floor(img.height * 0.85);

                    let statBottomY = safeBottom;
                    let statTopY = safeBottom;
                    let evalTopY = safeTop;

                    let phase = 0;
                    let darkHeight = 0;
                    let tempStatBottom = safeBottom;

                    for (let y = safeBottom; y >= safeTop; y--) {
                        let b = rowBrightness[y];

                        if (phase === 0) {
                            if (b > 115) phase = 1;
                        } 
                        else if (phase === 1) {
                            if (b < 105) { phase = 2; tempStatBottom = y; darkHeight = 1; }
                        } 
                        else if (phase === 2) {
                            if (b < 105) { darkHeight++; } 
                            else if (b > 115) { 
                                if (darkHeight > img.height * 0.045) { statBottomY = tempStatBottom; statTopY = y; phase = 3; } 
                                else { phase = 1; }
                            }
                        } 
                        else if (phase === 3) {
                            if (statTopY - y > img.height * 0.015) {
                                if (b < 100) { evalTopY = y; break; }
                            }
                        }
                    }

                    const evalRowBrightness = new Float32Array(img.width);
                    for (let x = 0; x < img.width; x++) {
                        let sum = 0;
                        let count = 0;
                        for (let y = evalTopY; y < statTopY; y++) {
                            const i = (y * img.width + x) * 4;
                            sum += 0.299 * tempData[i] + 0.587 * tempData[i+1] + 0.114 * tempData[i+2];
                            count++;
                        }
                        evalRowBrightness[x] = count > 0 ? sum / count : 0;
                    }

                    let cropLeft = 0;
                    let cropRight = img.width;
                    for (let x = 0; x < Math.floor(img.width / 2); x++) {
                        if (evalRowBrightness[x] > 115) { cropLeft = x; break; }
                    }
                    for (let x = img.width - 1; x > Math.floor(img.width / 2); x--) {
                        if (evalRowBrightness[x] > 115) { cropRight = x; break; }
                    }

                    cropLeft = Math.max(0, cropLeft - 5);
                    cropRight = Math.min(img.width, cropRight + 5);
                    const cropW = cropRight - cropLeft;
                    const cropTop = Math.max(0, evalTopY - 2);
                    const cropBottom = Math.min(img.height, statBottomY + 2);
                    const cropH = cropBottom - cropTop;

                    const scale = 6.5;
                    const pad = 10;
                    const canvas = document.createElement('canvas');
                    canvas.width = (cropW + pad * 2) * scale;
                    canvas.height = (cropH + pad * 2) * scale;
                    const ctx = canvas.getContext('2d');

                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(img, cropLeft, cropTop, cropW, cropH, pad * scale, pad * scale, cropW * scale, cropH * scale);

                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    const splitY = (statTopY - cropTop + pad) * scale;

                    const contrast = 80; 
                    const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));

                    for (let y = 0; y < canvas.height; y++) {
                        const isEvalBox = y < splitY;
                        for (let x = 0; x < canvas.width; x++) {
                            const i = (y * canvas.width + x) * 4;
                            let gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];

                            if (!isEvalBox) { gray = 255 - gray; }
                            gray = factor * (gray - 128) + 128;
                            if (gray > 255) gray = 255;
                            if (gray < 0) gray = 0;
                            data[i] = data[i+1] = data[i+2] = gray;
                        }
                    }

                    ctx.putImageData(imageData, 0, 0);
                    const dataUrl = canvas.toDataURL('image/png');
                    resolve(dataUrl);
                };
                img.src = imgSrc;
            });
        }

        function parseStatsFromOCRText(rawOCR) {
            let text = rawOCR;
            text = text.replace(/[Ss]/g, '5').replace(/B/g, '8');
            text = text.replace(/[OoDdQqg]/g, '0');
            text = text.replace(/[MNm]/g, '11');
            text = text.replace(/[Il|]/g, '1');
            text = text.replace(/([0-9]+)[a-zA-Z]+/g, '$1 ');
            text = text.replace(/[a-zA-Z]+([0-9]+)/g, ' $1');
        
            let allNums = (text.match(/\d+/g) || []).map(n => parseInt(n, 10));
            allNums = allNums.map(n => {
                if (n >= 10000 && n <= 19999) {
                    const candidate = n % 10000;
                    if (candidate >= 1000) return candidate; 
                }
                if (n >= 20000 && n <= 99999) {
                    const str = n.toString();
                    if(str[2] === str[3]) { return parseInt(str.slice(0,2) + str.slice(3), 10); }
                }
                return n;
            });
        
            for (const line of text.split('\n')) {
                const lineNums = (line.match(/\d+/g) || []).map(n => parseInt(n, 10)).filter(n => n >= 10 && n < 5000);
                if (lineNums.length === 9) return lineNums;
            }
        
            const evalPool = allNums.filter(n => n >= 4000 && n <= 12000);
            const statPool = allNums.filter(n => n >= 10  && n <  5000);
        
            if (evalPool.length >= 3 && statPool.length >= 9) {
                for (let s = 0; s <= statPool.length - 9; s++) {
                    const cand  = statPool.slice(s, s + 9);
                    let   score = 0;
                    for (let g = 0; g < 3; g++) {
                        const [hp, atk, def] = [cand[g*3], cand[g*3+1], cand[g*3+2]];
                        const calcEval = hp + (atk + def) * 4;
                        if (evalPool.some(e => Math.abs(e - calcEval) <= 30)) score++;
                    }
                    if (score >= 2) return cand;
                }
            }
        
            if (statPool.length >= 9) return statPool.slice(-9);
            return null;
        }

            ];

            try {
                let statNumbers = null;
                const processedImgSrc = await preprocessImageForOCR(imagePreview.src);
                const worker = await Tesseract.createWorker('eng');
                await worker.setParameters({ tessedit_pageseg_mode: '6' }); 
                const ret = await worker.recognize(processedImgSrc);
                await worker.terminate();
                
                rawText.value = ret.data.text;
                statNumbers = parseStatsFromOCRText(ret.data.text);
            
                if (statNumbers && statNumbers.length === 9) {
                    const evalWarnings = [];
                    let healedCount = 0;
                    let evalMatches = [...rawText.value.matchAll(/(?:Eval|Eva|Evel)\s*[:;]?\s*(\d{4,5})/gi)];
                    let evalVals = evalMatches.map(m => parseInt(m[1], 10));

                    if (evalVals.length < 3) {
                        const fallbackMatches = rawText.value.match(/\b[4-9]\d{3}\b|\b1[0-2]\d{3}\b/g) || [];
                        evalVals = fallbackMatches.map(n => parseInt(n, 10)).filter(n => n >= 4000 && n <= 12000);
                        if (evalVals.length > 3) evalVals = evalVals.slice(0, 3);
                    }

                    if (evalVals.length === 3) {

                            let hp = statNumbers[g*3], atk = statNumbers[g*3+1], def = statNumbers[g*3+2];
                            const calcEval = hp + (atk + def) * 4;
                            const realEval = evalVals[g];

                            if (calcEval !== realEval) {
                                const expectedHp = realEval - ((atk + def) * 4);
                                const expectedAtk = (realEval - hp) / 4 - def;
                                const expectedDef = (realEval - hp) / 4 - atk;
                                let healed = false;

                                if (expectedHp >= 1000 && expectedHp <= 6000 && atk >= 200 && atk <= 1500 && def >= 200 && def <= 1500) {
                                    statNumbers[g*3] = expectedHp; evalWarnings.push(`그룹 ${g+1} HP복구`); healed = true;
                                } else if (!healed && Number.isInteger(expectedAtk) && expectedAtk >= 200 && expectedAtk <= 1500 && hp >= 1000 && hp <= 6000 && def >= 200 && def <= 1500) {
                                    statNumbers[g*3+1] = expectedAtk; evalWarnings.push(`그룹 ${g+1} ATK복구`); healed = true;
                                } else if (!healed && Number.isInteger(expectedDef) && expectedDef >= 200 && expectedDef <= 1500 && hp >= 1000 && hp <= 6000 && atk >= 200 && atk <= 1500) {
                                    statNumbers[g*3+2] = expectedDef; evalWarnings.push(`그룹 ${g+1} DEF복구`); healed = true;
                                }

                            }
                        }

                extractBtn.disabled = false;
            }
        });
    </script>
</body>
